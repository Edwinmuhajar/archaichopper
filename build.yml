name: Build ArchaicHopper
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build plugin
        run: mvn -B clean package
      - uses: actions/upload-artifact@v4
        with:
          name: ArchaicHopper-5.0
          path: target/ArchaicHopper-5.0.jar
